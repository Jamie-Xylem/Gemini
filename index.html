<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Google AI Added</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    font-family: "Segoe UI", sans-serif;
    color: #e5e7eb;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Animated neon grid background */
  .grid {
    position: absolute;
    width: 200%;
    height: 200%;
    background: 
      linear-gradient(#0ea5e9 1px, transparent 1px),
      linear-gradient(90deg, #0ea5e9 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.08;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    from { transform: translate(-20%, -20%) rotate(0deg); }
    to { transform: translate(0%, 0%) rotate(360deg); }
  }

  /* Hologram rings */
  .ring {
    position: absolute;
    width: 500px;
    height: 500px;
    border: 2px solid rgba(56, 189, 248, 0.4);
    border-radius: 50%;
    animation: spin 12s linear infinite;
    filter: drop-shadow(0 0 20px #38bdf8);
  }

  .ring2 {
    width: 650px;
    height: 650px;
    animation-duration: 18s;
    opacity: 0.3;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #38bdf8;
    border-radius: 50%;
    animation: float 6s infinite ease-in-out;
    opacity: 0.7;
  }

  @keyframes float {
    0% { transform: translateY(0) scale(1); opacity: 0.4; }
    50% { transform: translateY(-40px) scale(1.4); opacity: 1; }
    100% { transform: translateY(0) scale(1); opacity: 0.4; }
  }

  /* Main hologram card */
  .card {
    padding: 40px 50px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(56, 189, 248, 0.4);
    box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
    backdrop-filter: blur(14px);
    text-align: center;
    max-width: 600px;
    animation: fadeIn 1.5s ease;
    position: relative;
    z-index: 10;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Gemini logo */
  .logo {
    width: 140px;
    margin-bottom: 20px;
    filter: drop-shadow(0 0 15px #38bdf8);
    animation: pulse 3s infinite ease-in-out;
  }

  @keyframes pulse {
    0% { transform: scale(1); filter: drop-shadow(0 0 15px #38bdf8); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 25px #7dd3fc); }
    100% { transform: scale(1); filter: drop-shadow(0 0 15px #38bdf8); }
  }

  .title {
    font-size: 32px;
    color: #38bdf8;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    text-shadow: 0 0 12px #38bdf8;
  }

  .subtitle {
    font-size: 16px;
    color: #9ca3af;
    margin-bottom: 25px;
  }

  .link {
    font-size: 18px;
    color: #38bdf8;
    text-decoration: none;
    border-bottom: 1px solid #38bdf8;
    padding-bottom: 2px;
    transition: 0.25s ease;
  }

  .link:hover {
    color: #7dd3fc;
    border-color: #7dd3fc;
    text-shadow: 0 0 12px #7dd3fc;
  }

  .footer {
    margin-top: 25px;
    font-size: 12px;
    color: #64748b;
  }
</style>
</head>

<body>

<div class="grid"></div>
<div class="ring"></div>
<div class="ring ring2"></div>

<!-- Floating particles -->
<script>
  for (let i = 0; i < 50; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = Math.random() * 100 + "vh";
    p.style.animationDelay = Math.random() * 5 + "s";
    document.body.appendChild(p);
  }
</script>

<div class="card">
  <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_Gemini_logo.svg/512px-Google_Gemini_logo.svg.png" alt="Gemini Logo">

  <div class="title">Thank You</div>

  <div class="subtitle">
    for adding <strong>Google AI</strong> to your server.<br>
    Your futuristic assistant is now online.
  </div>

  <a class="link" href="https://ai.google.dev/terms" target="_blank">
    View Gemini Terms of Service
  </a>

  <div class="footer">
    Created by Xylem — All rights reserved
  </div>
</div>

</body>
</html>
