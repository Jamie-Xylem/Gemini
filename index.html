<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Google AI Installed</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a1f2e 0%, #0f1320 60%, #0a0d18 100%);
    font-family: "Segoe UI", sans-serif;
    color: #ffffff;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Spinning Gemini logo in background */
  .bg-logo {
    position: absolute;
    width: 600px;
    height: 600px;
    opacity: 0.08;
    animation: spin 40s linear infinite;
    filter: drop-shadow(0 0 40px #6c4dff);
    z-index: 0;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Foreground card */
  .card {
    position: relative;
    z-index: 10;
    padding: 40px 50px;
    border-radius: 24px;
    background: rgba(26, 31, 46, 0.75);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(155, 108, 255, 0.3);
    box-shadow: 0 0 50px rgba(108, 77, 255, 0.35);
    text-align: center;
    max-width: 600px;
    animation: fadeIn 1.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .title {
    font-size: 32px;
    font-weight: 600;
    color: #e2d9ff;
    margin-bottom: 12px;
    text-shadow: 0 0 12px rgba(155, 108, 255, 0.6);
  }

  .subtitle {
    font-size: 16px;
    color: #cfc9e8;
    margin-bottom: 24px;
  }

  .link {
    font-size: 18px;
    color: #9b6cff;
    text-decoration: none;
    border-bottom: 1px solid #9b6cff;
    padding-bottom: 2px;
    transition: 0.25s ease;
  }

  .link:hover {
    color: #e2d9ff;
    border-color: #e2d9ff;
    text-shadow: 0 0 12px rgba(226, 217, 255, 0.8);
  }

  .footer {
    margin-top: 25px;
    font-size: 12px;
    color: #8a86a8;
  }
</style>
</head>

<body>

<!-- Background spinning Gemini logo -->
<img class="bg-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_Gemini_logo.svg/512px-Google_Gemini_logo.svg.png" alt="Gemini Logo">

<!-- Foreground content -->
<div class="card">
  <div class="title">THANK YOU</div>

  <div class="subtitle">
    for adding <strong>Google AI</strong> to your server.<br>
    Your futuristic assistant is now online.
  </div>

  <a class="link" href="https://ai.google.dev/terms" target="_blank">
    View Gemini Terms of Service
  </a>

  <div class="footer">
    Created by Xylem — All rights reserved
  </div>
</div>

</body>
</html>
